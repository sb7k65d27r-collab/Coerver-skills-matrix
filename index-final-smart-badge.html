</style></head><body><header><div class="ball">⚽</div><div class="club">NEWCASTLE WANDERERS BLACK</div><div class="title">COERVER SKILLS MATRIX</div></header><main><div class="tabs"><button id="pb" class="on">⚽ PLAYER PROGRESS</button><button id="tb">🏆 TEAM PROGRESS</button></div><section id="player"><div class="card"><b style="color:#ffd400">SELECT PLAYER</b><select id="sel"></select><div style="display:flex;justify-content:space-between;margin-top:15px"><span>Overall progress</span><b id="pct" style="color:#ffd400">0%</b></div><div class="meter"><div id="bar" class="bar"></div></div><div id="playerStats"></div></div><div id="challenge" class="card challenge"></div><div id="skills"></div></section><section id="team" style="display:none"><div id="teamScore" class="card teamScore"></div><div class="card"><div class="category">🏆 TEAM PROGRESS</div><div id="teamdata"></div></div></section></main>
<div id="pcModal" class="pcModal"><div class="pcShell"><div id="playerCardFull" class="playerCard tier-bronze"></div><button id="pcClose" class="pcClose">CLOSE PLAYER CARD</button></div></div>
<div id="talkModal" class="modal"><div class="talk"><div class="icon">⚽</div><h2>TODAY'S TEAM TALK</h2><div id="talkPlayer" class="playerTalk"></div><div id="talkMessage" class="message"></div><div class="small">A new football message every day.</div><button id="talkClose">LET'S GO ⚽</button></div></div>
<script>
const API='https://ziwobmtalpjebbwbawgs.supabase.co/functions/v1/coerver-skills';let P=[],S=[],R={},C={},CH=null,OPEN=null;const L=[0,20,40,60,80,100,120,140,160,180,200],sel=document.getElementById('sel'),k=(p,s)=>p+'_'+s,rep=(p,s)=>R[k(p,s)]||0,crep=(p,s)=>C[k(p,s)]||0;
const label=c=>c==='Changes of Direction'?'CHANGES OF DIRECTION':c==='Stops and Starts'?'STOPS & STARTS':'FEINTS';const range=c=>c==='Changes of Direction'?'Skills 1–15':c==='Stops and Starts'?'Skills 16–27':'Skills 28–47';
const TEAM_TALKS=['Be brave on the ball today. Try the skill even if it does not work the first time! 💪','Every touch helps you improve. Keep the ball close and enjoy your football! ⚽','Great players practise with both feet. Give your weaker foot some extra touches today! 🌟','Mistakes are part of learning. Try it, learn from it, then go again! 🔥','Can you use one of your Coerver moves in a game this week? Be brave and have a go! 🪄','Good footballers look up as well as down. Control the ball, then see what is around you! 👀','Small improvements every day make a big difference. Your next 20 reps matter! 💛🖤','Fast feet, calm head. Take your time to do the skill properly before speeding it up! ⚡','Football should be fun. Smile, work hard and enjoy learning something new today! 😄','Use both feet, keep practising, and trust yourself on the ball! ⚽','The best skill is the one you are brave enough to try in a match! 💪','Do not worry about being perfect. Focus on getting a little better today! 🌟','Can you make the ball do exactly what you want? Lots of little touches will help! 🎯','Work hard when nobody is watching. That is how confidence grows! 🔥','Be a great teammate today: encourage someone, share the ball and keep trying! 🤝','When a move feels difficult, slow it down, learn the steps, then build up the speed! 🧠','Every 20 reps is another step forward. Keep building! 🚀','Try something creative today. Football is a game for brave ideas! 🪄','Your weaker foot gets stronger every time you use it. Give it a chance today! 🌟','Win or lose, there is always something you can learn from your football today! 🧠','Confidence grows when you practise. Do the work and trust yourself! 💛🖤','One more try can be the one where it clicks. Keep going! 🔥','Be proud of every bit of progress, then keep working for the next one! 🏆','Control first, speed second. Clean touches make fast football possible! ⚡','Work hard. Be brave. Be kind. Enjoy your football. 💛🖤'];
function localDayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function showTeamTalk(pid){const p=P.find(x=>String(x.id)===String(pid));if(!p)return;const day=localDayKey(),seen='teamtalk_seen_'+pid+'_'+day;if(localStorage.getItem(seen))return;const idx=hash(pid+'|'+day)%TEAM_TALKS.length;talkPlayer.textContent=p.name.toUpperCase();talkMessage.textContent=TEAM_TALKS[idx];talkModal.classList.add('show');talkClose.onclick=()=>{localStorage.setItem(seen,'1');talkModal.classList.remove('show')}}
async function load(){let d=await fetch(API+'?api=data').then(r=>r.json());P=d.players;S=d.skills;CH=d.challenge;d.progress.forEach(x=>R[k(x.player_id,x.skill_id)]=x.reps);(CH?.progress||[]).forEach(x=>C[k(x.player_id,x.skill_id)]=x.reps);P.forEach(p=>sel.add(new Option(p.name,p.id)));sel.onchange=()=>{OPEN=null;render();showTeamTalk(sel.value)};render();setTimeout(()=>showTeamTalk(sel.value),150)}
function total(pid){return S.reduce((a,s)=>a+rep(pid,s.id),0)}function mastered(pid){return S.filter(s=>rep(pid,s.id)>=200).length}
function catRating(pid,cat){
  const arr=S.filter(s=>s.category===cat); if(!arr.length)return 45;
  const done=arr.reduce((a,s)=>a+Math.min(200,rep(pid,s.id)),0), max=arr.length*200;
  return Math.min(99,Math.max(45,Math.round(45+54*(done/max))));
}
function playerCardData(pid){
  const cod=catRating(pid,'Changes of Direction');
  const ss=catRating(pid,'Stops and Starts');
  const feint=catRating(pid,'Feints');
  const max=S.length*200, t=total(pid);
  const control=Math.min(99,Math.max(45,Math.round(45+54*(t/max))));
  const work=Math.min(99,Math.max(45,Math.round(45+54*Math.min(1,t/5000))));
  const ovr=Math.min(99,Math.max(45,Math.round(cod*.25+ss*.20+feint*.25+control*.20+work*.10)));
  let tier='Bronze', cls='tier-bronze', next=60;
  if(ovr>=95){tier='Icon';cls='tier-icon';next=99}
  else if(ovr>=90){tier='Black / Gold';cls='tier-blackgold';next=95}
  else if(ovr>=80){tier='Elite';cls='tier-elite';next=90}
  else if(ovr>=70){tier='Gold';cls='tier-gold';next=80}
  else if(ovr>=60){tier='Silver';cls='tier-silver';next=70}
  return {ovr,tier,cls,next,cod,ss,feint,control,work};
}
function openPlayerCard(pid){
  const p=P.find(x=>String(x.id)===String(pid)); if(!p)return;
  const d=playerCardData(pid), m=mastered(pid), t=total(pid);
  const upgrade=d.ovr>=99?'MAX RATING REACHED 👑':(d.next-d.ovr)+' OVR to the next card colour';
  playerCardFull.className='playerCard '+d.cls;
  playerCardFull.innerHTML='<div class="pcTop"><div><div class="pcOVR">'+d.ovr+'</div><div class="pcTier">'+d.tier.toUpperCase()+'</div></div><div class="pcBadge">NWB • SKILLS</div></div><div class="silhouette"><div class="head"></div><div class="body"></div></div><div class="pcName">'+p.name+'</div><div class="pcClub">NEWCASTLE WANDERERS BLACK</div><div class="pcDivider"></div><div class="pcStatsGrid"><div class="pcStat"><b>'+d.cod+'</b><span>COD</span></div><div class="pcStat"><b>'+d.ss+'</b><span>S&S</span></div><div class="pcStat"><b>'+d.feint+'</b><span>FEINT</span></div><div class="pcStat"><b>'+d.control+'</b><span>CTRL</span></div><div class="pcStat"><b>'+d.work+'</b><span>WORK</span></div><div class="pcStat"><b>'+m+'</b><span>MASTERED</span></div></div><div class="pcProgress">'+t.toLocaleString()+' total reps • '+m+' / 47 skills mastered</div><div class="upgradeNote">'+upgrade+'</div><div class="pcFooter">Ratings update automatically from Skills Matrix progress.</div>';
  pcModal.classList.add('show');
}
pcClose.onclick=()=>pcModal.classList.remove('show');
pcModal.onclick=e=>{if(e.target===pcModal)pcModal.classList.remove('show')};

function badges(pid){const t=total(pid),m=mastered(pid),any20=S.some(s=>rep(pid,s.id)>=20),any100=S.some(s=>rep(pid,s.id)>=100),any200=m>0;return[{e:any20,icon:'🥉',name:'First Touch'},{e:any100,icon:'🥈',name:'100 Club'},{e:any200,icon:'🏆',name:'Mastered It'},{e:t>=1000,icon:'⚡',name:'1,000 Rep Club'},{e:m>=5,icon:'🔥',name:'5 Skills Mastered'},{e:m>=10,icon:'⭐',name:'10 Skills Mastered'},{e:m>=47,icon:'👑',name:'Coerver Master'}]}
function renderStats(pid){let t=total(pid),m=mastered(pid),b=badges(pid),d=playerCardData(pid),h='<div class="stats"><div class="stat"><b>'+t.toLocaleString()+'</b>Total Reps</div><div class="stat"><b>'+m+' / 47</b>Skills Mastered</div></div><div class="cardMiniWrap"><button class="playerCardBtn" onclick="openPlayerCard('+pid+')"><div><strong>⚽ PLAYER CARD</strong><div class="miniHint">Tap to view full card</div></div><div><span class="miniRating">OVR '+d.ovr+' • '+d.tier+'</span> <span class="chev">›</span></div></button></div><div class="badges">';b.forEach(x=>h+='<div class="badge '+(x.e?'earned':'')+'">'+x.icon+' '+x.name+'</div>');playerStats.innerHTML=h+'</div>'}
function challengeDone(pid){return CH&&CH.skills.every(s=>crep(pid,s.id)>=CH.target)}
function renderChallenge(pid){let o=document.getElementById('challenge');if(!CH){o.style.display='none';return}o.style.display='block';let h='<h2>🏆 WEEKLY CHALLENGE</h2><div class="meta">Separate from the main Skills Matrix • resets automatically every Monday</div>';CH.skills.forEach(s=>{let v=crep(pid,s.id);h+='<div class="challengeSkill"><div class="challengeTop"><b>'+s.name+'</b><span>'+Math.min(v,CH.target)+' / '+CH.target+'</span></div><div class="challenge-meter"><div class="challenge-bar" style="width:'+Math.min(100,v/CH.target*100)+'%"></div></div><div class="cactions"><button class="cbtn" onclick="cadd('+pid+','+s.id+',20)">+20</button><button class="cbtn reset" onclick="cset('+pid+','+s.id+',0)">Reset</button></div></div>'});if(challengeDone(pid))h+='<div class="complete">CHALLENGE COMPLETE! 🏆</div>';o.innerHTML=h}
async function cadd(p,s,n){cset(p,s,Math.min(200,crep(p,s)+n))}async function cset(p,s,v){let old=crep(p,s);C[k(p,s)]=v;render();let r=await fetch(API+'?api=savechallenge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({player_id:+p,skill_id:+s,reps:v})});if(!r.ok){C[k(p,s)]=old;render();alert('Challenge save failed')}}
function render(){let p=sel.value;if(!p)return;let t=total(p),max=S.length*200;pct.textContent=Math.round(t/max*100)+'%';bar.style.width=t/max*100+'%';renderStats(+p);renderChallenge(+p);let b=document.getElementById('skills');b.innerHTML='';[...new Set(S.map(s=>s.category))].forEach(c=>{let x=document.createElement('div');x.className='card';x.innerHTML='<div class="category">⚽ '+label(c)+'<div class="catnote">'+range(c)+'</div></div>';S.filter(s=>s.category===c).forEach(s=>{let r=document.createElement('div');r.className='row';r.innerHTML='<div class="skill">'+s.number+'. '+s.name+'</div><div class="meta">'+rep(p,s.id)+' / 200 reps completed</div>';if(s.video_url){let d=document.createElement('button');d.className='demo';d.textContent=OPEN===s.id?'Hide Demo':'▶ Watch Demo';d.onclick=()=>{OPEN=OPEN===s.id?null:s.id;render()};r.appendChild(d);if(OPEN===s.id){let w=document.createElement('div');w.className='watchbox';w.innerHTML='<a target="_blank" rel="noopener" href="'+s.video_url+'">▶ Open '+s.name+' video on YouTube</a>';r.appendChild(w)}}let q=document.createElement('div');q.className='reps';L.forEach(v=>{let z=document.createElement('button');z.className='rep'+(v===0?' reset':'')+(rep(p,s.id)===v?' on':'');z.textContent=v===0?'Reset':v;z.onclick=()=>save(p,s.id,v);q.appendChild(z)});r.appendChild(q);x.appendChild(r)});b.appendChild(x)})}
async function save(p,s,v){let old=rep(p,s);R[k(p,s)]=v;render();let r=await fetch(API+'?api=save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({player_id:+p,skill_id:+s,reps:v})});if(!r.ok){R[k(p,s)]=old;render();alert('Save failed')}}
function renderTeam(){let teamTotal=P.reduce((a,p)=>a+total(p.id),0),teamMastered=P.reduce((a,p)=>a+mastered(p.id),0),repTarget=P.length*S.length*200,masterTarget=P.length*S.length,repPct=repTarget?Math.round(teamTotal/repTarget*100):0,masterPct=masterTarget?Math.round(teamMastered/masterTarget*100):0,teamPct=repTarget?Math.round(teamTotal/repTarget*100):0;teamScore.innerHTML='<div class="teamTitle">⚽ NEWCASTLE WANDERERS BLACK TEAM SCORE</div><div class="teamGrid"><div class="teamMetric"><div class="teamMetricTop"><div><div class="big">'+teamTotal.toLocaleString()+'</div><div>Team Reps</div></div><div class="target">Target<br><b>'+repTarget.toLocaleString()+'</b></div></div><div class="meter"><div class="bar" style="width:'+Math.min(100,repPct)+'%"></div></div><div class="meta">'+teamTotal.toLocaleString()+' / '+repTarget.toLocaleString()+' reps</div></div><div class="teamMetric"><div class="teamMetricTop"><div><div class="big">'+teamMastered+'</div><div>Skills Mastered</div></div><div class="target">Target<br><b>'+masterTarget+'</b></div></div><div class="meter"><div class="bar" style="width:'+Math.min(100,masterPct)+'%"></div></div><div class="meta">'+teamMastered+' / '+masterTarget+' skills mastered</div></div></div><div class="teamPct">📈 Team Completion: '+teamPct+'%</div>';let a=P.map(p=>({name:p.name,id:p.id,total:total(p.id),pct:Math.round(total(p.id)/(S.length*200)*100),done:challengeDone(p.id)})).sort((a,b)=>b.total-a.total || b.pct-a.pct || a.name.localeCompare(b.name)),h='<table><tr><th>#</th><th>Player</th><th>Weekly Challenge</th><th>Progress</th><th>Reps</th></tr>';a.forEach((x,i)=>h+='<tr><td class="rank">'+(i+1)+'</td><td><b>'+x.name+'</b></td><td class="trophy">'+(x.done?'🏆':'—')+'</td><td>'+x.pct+'%</td><td>'+x.total+'</td></tr>');teamdata.innerHTML=h+'</table>'}
pb.onclick=()=>{player.style.display='block';team.style.display='none';pb.className='on';tb.className=''};tb.onclick=()=>{player.style.display='none';team.style.display='block';pb.className='';tb.className='on';renderTeam()};load();
