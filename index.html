function matchEvents(matchId,type){return MATCH_EVENTS.filter(e=>String(e.match_id)===String(matchId)&&e.event_type===type)}
function baselineTotals(label,field){
  const sid=seasonId(label),out={};
  MATCH_BASELINES.filter(b=>b.season_id===sid).forEach(b=>out[b.player_name]=(out[b.player_name]||0)+(+b[field]||0));
  seasonMatches(label).filter(m=>!m.included_in_baseline).forEach(m=>matchEvents(m.id,field==='goals'?'goal':'assist').forEach(e=>out[e.player_name]=(out[e.player_name]||0)+(+e.quantity||1)));
  return Object.entries(out).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))
}

function closeSeason(){MATCH_SEASON=null;renderMatchCentre()}
function renderSeason(){
  const o=document.getElementById('matchCentre'),ms=seasonMatches(MATCH_SEASON),r=record(ms),goals=baselineTotals(MATCH_SEASON,'goals'),assists=baselineTotals(MATCH_SEASON,'assists');
  let h='<div class="mcTopbar"><button class="mcBack" onclick="closeSeason()">← Seasons</button>'+(MATCH_SEASON==='2026/27'?'<button class="mcAddBtn" onclick="toggleAddMatch()">+ Add Match</button>':'')+'</div>';
  h+='<div class="mcHero"><div class="mcEyebrow">Match Centre</div><div class="mcSeasonTitle"><span>'+MATCH_SEASON+'</span> Season</div><div class="mcSub">'+ms.length+' matches recorded</div><div class="mcRecord"><div><b>'+r.w+'</b><span>WON</span></div><div><b>'+r.d+'</b><span>DRAWN</span></div><div><b>'+r.l+'</b><span>LOST</span></div></div></div>';
  if(MATCH_SEASON==='2026/27')h+='<div id="addMatchBox" class="mcSection" style="display:none"><div class="mcSectionHead">Add New Match</div><div class="mcFormWrap"><div class="mcForm"><input id="mfDate" type="date"><input id="mfOpp" placeholder="Opponent"><select id="mfComp"><option>League</option><option>Friendly</option><option>Cup</option><option>Tournament</option></select><div class="mcFormRow"><input id="mfFor" type="number" min="0" placeholder="NWB goals"><input id="mfAgainst" type="number" min="0" placeholder="Opponent goals"></div><input id="mfMom" placeholder="MOM (optional)"><textarea id="mfGoals" placeholder="Goals: Freddie x3, Niall x2, Joey"></textarea><textarea id="mfAssists" placeholder="Assists: Vinny x2, Joey"></textarea><div class="mcHint">Use commas between players. Use x2, x3 etc. for multiple goals/assists.</div><button class="mcSave" onclick="submitMatch()">Save Result</button><div id="mfStatus"></div></div></div></div>';
  h+='<div class="mcSection"><div class="mcSectionHead">Results</div>';
  if(!ms.length) h+='<div class="mcEmpty">No matches recorded yet.</div>';
  ms.forEach(m=>{
    const gs=matchEvents(m.id,'goal'),as=matchEvents(m.id,'assist');
    h+='<div class="mcResult" onclick="this.classList.toggle(\'open\')"><div class="mcResultTop"><div><div class="mcOpponent">'+esc(m.opponent)+'</div><div class="mcMeta">'+esc(fmtDate(m.match_date))+(m.competition?' • '+esc(m.competition):'')+(m.mom?' • MOM: '+esc(m.mom):'')+'</div></div><div class="mcScore">'+m.goals_for+'–'+m.goals_against+'</div></div><div class="mcDetails"><div><b>Goals:</b> '+(gs.length?gs.map(e=>esc(e.player_name)+(e.quantity>1?' ×'+e.quantity:'')).join(', '):(m.notes?'See match notes':'—'))+'</div><div><b>Assists:</b> '+(as.length?as.map(e=>esc(e.player_name)+(e.quantity>1?' ×'+e.quantity:'')).join(', '):(m.notes?'See match notes':'—'))+'</div>'+(m.notes?'<div class="mcNotes">'+esc(m.notes)+'</div>':'')+'</div></div>'
  });
  h+='</div>';
  h+='<div class="mcSection"><div class="mcSectionHead">Top Scorers</div><table class="mcTable"><tr><th>#</th><th>Player</th><th>Goals</th></tr>'+goals.map((x,i)=>'<tr><td class="mcRank">'+(i+1)+'</td><td><b>'+esc(x[0])+'</b></td><td>'+x[1]+'</td></tr>').join('')+'</table></div>';
  h+='<div class="mcSection"><div class="mcSectionHead">Top Assists</div><table class="mcTable"><tr><th>#</th><th>Player</th><th>Assists</th></tr>'+assists.map((x,i)=>'<tr><td class="mcRank">'+(i+1)+'</td><td><b>'+esc(x[0])+'</b></td><td>'+x[1]+'</td></tr>').join('')+'</table></div>';
  o.innerHTML=h
}
function toggleAddMatch(){const x=document.getElementById('addMatchBox');if(x)x.style.display=x.style.display==='none'?'block':'none'}
function parseEvents(text,type){return text.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)(?:\s+x(\d+))?$/i);return{event_type:type,player_name:m[1].trim(),quantity:+(m[2]||1)}})}
async function submitMatch(){
  const st=document.getElementById('mfStatus');
  const body={season_id:'26-27',match_date:mfDate.value||null,opponent:mfOpp.value.trim(),competition:mfComp.value,goals_for:+mfFor.value,goals_against:+mfAgainst.value,mom:mfMom.value.trim()||null,events:[...parseEvents(mfGoals.value,'goal'),...parseEvents(mfAssists.value,'assist')]};
  if(!body.opponent||mfFor.value===''||mfAgainst.value===''){st.className='mcError';st.textContent='Enter the opponent and score.';return}
  st.className='mcStatus';st.textContent='Saving...';
  const r=await fetch(API+'?api=addmatch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){st.className='mcError';st.textContent='Save failed. Try again.';return}
  await loadMatches()
}

pb.onclick=()=>{player.style.display='block';team.style.display='none';match.style.display='none';pb.className='on';tb.className='';mb.className=''};tb.onclick=()=>{player.style.display='none';team.style.display='block';match.style.display='none';pb.className='';tb.className='on';mb.className='';renderTeam();renderJourney()};mb.onclick=()=>{player.style.display='none';team.style.display='none';match.style.display='block';pb.className='';tb.className='';mb.className='on';loadMatches()};load();

let JOURNEY_MODE='reps';
function jstage(pid){const a=S.map(s=>+rep(pid,s.id)||0),m=Math.max(0,...a);return m>=800?'nitro':m>=600?'rage':m>=400?'beast':m>=200?'elite':'standard'}
function renderJourney(){
  if(!P.length||!S.length)return;
  const W=900,H=440,L=70,R=24,T=28,B=52,plotW=W-L-R,plotH=H-T-B;
  const maxX=S.length*1000;
  const thresholds=[0,200,400,600,800,1000];
  const labels=['START','ELITE','BEAST','RAGE','NITRO','COMPLETE'];
  const cols=['#ffd400','#00eaff','#ff1744','#b000ff','#39ff14','#fff'];
  const players=P.map(p=>{
    const vals=S.map(s=>Number(rep(p.id,s.id))||0);
    const total=vals.reduce((a,b)=>a+b,0);
    const stages=[0,200,400,600,800,1000].map(t=>vals.reduce((a,v)=>a+Math.min(v,t),0));
    return {p,vals,total,stages}
  });
  const maxY=Math.max(1000,...players.map(x=>x.total));
  const x=i=>L+(i/(thresholds.length-1))*plotW;
  const y=v=>T+plotH-(Math.min(v,maxY)/maxY)*plotH;
  let svg='<svg class="journeySvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Team journey line graph">';
  // grid + stage labels
  thresholds.forEach((t,i)=>{
    svg+='<line x1="'+x(i)+'" y1="'+T+'" x2="'+x(i)+'" y2="'+(T+plotH)+'" class="jgGrid"/>';
    svg+='<text x="'+x(i)+'" y="'+(H-18)+'" text-anchor="middle" class="jgStage" fill="'+cols[i]+'">'+labels[i]+'</text>';
  });
  [0,.25,.5,.75,1].forEach(q=>{
    const yy=T+plotH-q*plotH;
    svg+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" class="jgGrid h"/>';
    svg+='<text x="'+(L-8)+'" y="'+(yy+3)+'" text-anchor="end" class="jgAxis">'+Math.round(maxY*q).toLocaleString()+'</text>';
  });
  players.forEach((o,pi)=>{
    const hue=(pi*47)%360;
    const pts=o.stages.map((v,i)=>x(i)+','+y(v)).join(' ');
    svg+='<polyline points="'+pts+'" class="jgLine" style="stroke:hsl('+hue+' 90% 62%)"/>';
    o.stages.forEach((v,i)=>svg+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" style="fill:hsl('+hue+' 90% 62%)" class="jgPoint"/>');
    const lx=x(5),ly=y(o.stages[5]);
    svg+='<text x="'+(lx-7)+'" y="'+(ly-8-(pi%3)*5)+'" text-anchor="end" class="jgName" style="fill:hsl('+hue+' 90% 70%)">'+esc(o.p.name)+'</text>';
  });
  svg+='</svg>';
  const cards=players.sort((a,b)=>b.total-a.total).map(o=>'<span class="jgChip">'+esc(o.p.name)+' <b>'+o.total.toLocaleString()+'</b></span>').join('');
  journeyBoard.innerHTML='<div class="jgTitle">ALL-PLAYER PROGRESS</div><div class="jgSub">Each line shows how far a player has travelled through the skill levels.</div><div class="jgScroll">'+svg+'</div><div class="jgChips">'+cards+'</div>';
}
jr.onclick=()=>{JOURNEY_MODE='reps';jr.className='jmode on';js.className='jmode';renderJourney()};
js.onclick=()=>{JOURNEY_MODE='skills';js.className='jmode on';jr.className='jmode';renderJourney()};
</script></body></html>
